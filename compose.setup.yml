# First deployment: hub plus background Prometheus, without the agent and bot.
# Copy the hub public key, then switch this SAME resource to docker-compose.yml.
# Keep shared service/volume definitions in sync with docker-compose.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  beszel:
    image: henrygd/beszel:0.21.0
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL:?Set BESZEL_APP_URL to your public HTTPS URL}
      USER_EMAIL: ${BESZEL_USER_EMAIL:?Set BESZEL_USER_EMAIL}
      USER_PASSWORD: ${BESZEL_USER_PASSWORD:?Set BESZEL_USER_PASSWORD}
      CHECK_UPDATES: "false"
    expose:
      - "8090"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    logging: *logging

  prometheus:
    build:
      context: ./prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep every scraped sample for 30 days; a size cap could evict it sooner.
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - prometheus-data:/prometheus
    extra_hosts:
      - "node-host:${NODE_EXPORTER_HOST:-172.17.0.1}"
    depends_on:
      node-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    # Host networking is needed for real host interface counters (not bridge eth0).
    # Bind only to docker0, never to the server's public interface.
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=${NODE_EXPORTER_HOST:-172.17.0.1}:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containers)($$|/)
      - --collector.netdev.device-exclude=^(lo|veth.*|docker.*|br-.*)$$
      - --no-collector.timex
    environment:
      NODE_EXPORTER_HOST: ${NODE_EXPORTER_HOST:-172.17.0.1}
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$${NODE_EXPORTER_HOST}:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true
    cgroup: host
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --docker=${DOCKER_ENDPOINT:-unix:///var/run/docker.sock}
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Keep bind paths literal: Coolify validates them before env interpolation.
      # For a custom DockerRootDir, change BOTH paths here and in docker-compose.yml.
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    logging: *logging

volumes:
  beszel-data:
  beszel-socket:
  prometheus-data:
